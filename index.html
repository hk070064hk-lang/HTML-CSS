<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nambu Code Editor</title>

  <!-- PWA メタタグ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NambuEditor">
  <meta name="theme-color" content="#FFD400">

  <link rel="icon" id="dynamic-favicon">
  <link rel="apple-touch-icon" id="dynamic-apple-icon">
  <link rel="manifest" id="dynamic-manifest">

  <style>
    /* 影・シャドウの完全排除 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      box-shadow: none !important;
      text-shadow: none !important;
      filter: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* 南武線イエロー (#FFD400) とテーマ変数 */
    :root {
      --nambu-yellow: #FFD400;
      --border-width: 2px;
    }

    /* ダークテーマ */
    html[data-theme="dark"] {
      --bg-main: #1e1e1e;
      --bg-sub: #252526;
      --bg-header: #FFD400;
      --text-header: #000000;
      --text-main: #f0f0f0;
      --border-color: #3c3c3c;
      --active-tab-bg: #2d2d2d;
      --drawer-bg: #1e1e1e;
    }

    /* ライトテーマ */
    html[data-theme="light"] {
      --bg-main: #ffffff;
      --bg-sub: #f3f3f3;
      --bg-header: #FFD400;
      --text-header: #000000;
      --text-main: #222222;
      --border-color: #cccccc;
      --active-tab-bg: #e5e5e5;
      --drawer-bg: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
    }

    /* ヘッダー（南武線イエロー一括） */
    header {
      padding: 6px 12px;
      background-color: var(--bg-header);
      color: var(--text-header);
      border-bottom: var(--border-width) solid #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* フラットボタン */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      border: var(--border-width) solid #000000;
      background-color: #ffffff;
      color: #000000;
      cursor: pointer;
      border-radius: 0; /* 完全スクエアフラット */
    }

    .btn:active {
      background-color: #000000 !important;
      color: var(--nambu-yellow) !important;
    }

    .btn-icon {
      font-size: 16px;
      padding: 4px 8px;
    }

    .current-project-name {
      font-weight: bold;
      font-size: 13px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* スマホ用タブバー */
    .mobile-tabs {
      display: none;
      background-color: var(--bg-sub);
      border-bottom: var(--border-width) solid var(--border-color);
      flex-shrink: 0;
    }

    .mobile-tab-btn {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-main);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .mobile-tab-btn.active {
      border-bottom: 3px solid var(--nambu-yellow);
      background-color: var(--active-tab-bg);
      color: var(--text-main);
    }

    /* メインコンテナ */
    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* エディタ区画 */
    .editor-pane {
      width: 50%;
      display: flex;
      flex-direction: column;
      border-right: var(--border-width) solid var(--border-color);
    }

    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .editor-section:first-child {
      border-bottom: var(--border-width) solid var(--border-color);
    }

    .editor-title {
      padding: 4px 12px;
      background-color: var(--bg-sub);
      font-size: 11px;
      font-weight: bold;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
    }

    .editor-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    /* プレビュー区画 */
    .preview-pane {
      width: 50%;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    .preview-title {
      padding: 4px 12px;
      background-color: var(--bg-sub);
      color: var(--text-main);
      font-size: 11px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }

    /* サイドドロワー（プロジェクト一覧） */
    .drawer-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100%;
      background-color: var(--drawer-bg);
      border-right: var(--border-width) solid #000000;
      z-index: 101;
      display: flex;
      flex-direction: column;
      transition: left 0.2s ease-out;
    }

    .drawer.open {
      left: 0;
    }

    .drawer-header {
      padding: 12px;
      background-color: var(--nambu-yellow);
      color: #000000;
      font-weight: bold;
      font-size: 15px;
      border-bottom: var(--border-width) solid #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .project-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-sub);
      cursor: pointer;
      color: var(--text-main);
    }

    .project-item.active {
      border: var(--border-width) solid #000000;
      background-color: var(--nambu-yellow);
      color: #000000;
      font-weight: bold;
    }

    .project-item-actions {
      display: flex;
      gap: 4px;
    }

    .btn-small {
      padding: 2px 6px;
      font-size: 11px;
      border: 1px solid #000000;
      background: #ffffff;
      color: #000000;
      cursor: pointer;
    }

    /* スマホ画面対応 */
    @media (max-width: 768px) {
      .mobile-tabs {
        display: flex;
      }

      .container {
        flex-direction: column;
      }

      .editor-pane, .preview-pane {
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
      }

      .editor-section {
        display: none;
      }

      .show-html #section-html {
        display: flex;
        height: 100%;
        border-bottom: none;
      }
      .show-html .editor-pane {
        display: flex;
      }

      .show-css #section-css {
        display: flex;
        height: 100%;
      }
      .show-css .editor-pane {
        display: flex;
      }

      .show-preview .preview-pane {
        display: flex;
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="show-html">

  <!-- ヘッダー -->
  <header>
    <div class="header-left">
      <button id="btn-menu" class="btn btn-icon" title="プロジェクト一覧">≡</button>
      <span class="current-project-name" id="label-project-name">新規プロジェクト</span>
    </div>

    <div class="header-right">
      <button id="btn-theme" class="btn btn-icon" title="テーマ切り替え">☀️</button>
      <button id="btn-load-trigger" class="btn" title="ファイル読込">📂 読込</button>
      <input type="file" id="file-loader" accept=".html,.css,.zip,.txt" style="display:none">
      <button id="download-zip" class="btn" title="ZIPダウンロード">📥 ZIP</button>
    </div>
  </header>

  <!-- スマホ専用タブ -->
  <div class="mobile-tabs">
    <button class="mobile-tab-btn active" data-tab="show-html">HTML</button>
    <button class="mobile-tab-btn" data-tab="show-css">CSS</button>
    <button class="mobile-tab-btn" data-tab="show-preview">PREVIEW</button>
  </div>

  <!-- エディタ & プレビュー -->
  <div class="container">
    <div class="editor-pane">
      <div id="section-html" class="editor-section">
        <div class="editor-title">HTML</div>
        <div id="html-editor" class="editor-container"></div>
      </div>

      <div id="section-css" class="editor-section">
        <div class="editor-title">CSS</div>
        <div id="css-editor" class="editor-container"></div>
      </div>
    </div>

    <div class="preview-pane">
      <div class="preview-title">PREVIEW</div>
      <iframe id="preview"></iframe>
    </div>
  </div>

  <!-- プロジェクト管理ドロワー -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <div id="drawer" class="drawer">
    <div class="drawer-header">
      <span>プロジェクト</span>
      <button id="btn-close-drawer" class="btn btn-small">✕</button>
    </div>
    <div style="padding: 10px; border-bottom: 1px solid var(--border-color);">
      <button id="btn-new-project" class="btn" style="width: 100%;">＋ 新しいプロジェクト</button>
    </div>
    <div id="project-list" class="drawer-content"></div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. 南武線イエロー PWA アイコン自動生成
    // -------------------------------------------------------------
    (function setupPWA() {
      const canvas = document.createElement('canvas');
      canvas.width = 192;
      canvas.height = 192;
      const ctx = canvas.getContext('2d');

      // 背景（南武線イエロー #FFD400）
      ctx.fillStyle = '#FFD400';
      ctx.fillRect(0, 0, 192, 192);

      // アイコン文字（黒）
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 76px -apple-system, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('</>', 96, 96);

      const iconUrl = canvas.toDataURL('image/png');
      document.getElementById('dynamic-favicon').href = iconUrl;
      document.getElementById('dynamic-apple-icon').href = iconUrl;

      const manifest = {
        name: "Nambu Code Editor",
        short_name: "NambuEditor",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#FFD400",
        theme_color: "#FFD400",
        icons: [{ src: iconUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('dynamic-manifest').href = URL.createObjectURL(blob);
    })();

    // -------------------------------------------------------------
    // 2. プロジェクト管理 & 自動保存 (LocalStorage)
    // -------------------------------------------------------------
    const STORAGE_KEY = 'nambu_editor_projects_v1';
    const ACTIVE_KEY = 'nambu_editor_active_id_v1';

    let projects = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      { id: 'p_default', name: 'プロジェクト 1', html: '', css: '' }
    ];
    let activeProjectId = localStorage.getItem(ACTIVE_KEY) || projects[0].id;

    function saveProjects() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
      localStorage.setItem(ACTIVE_KEY, activeProjectId);
    }

    function getActiveProject() {
      return projects.find(p => p.id === activeProjectId) || projects[0];
    }

    // -------------------------------------------------------------
    // 3. テーマ切り替え (ライト / ダーク)
    // -------------------------------------------------------------
    const themeBtn = document.getElementById('btn-theme');
    let currentTheme = localStorage.getItem('nambu_theme') || 'dark';

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('nambu_theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';

      if (window.monaco) {
        monaco.editor.setTheme(theme === 'dark' ? 'vs-dark' : 'vs');
      }
    }
    applyTheme(currentTheme);

    themeBtn.addEventListener('click', () => {
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // -------------------------------------------------------------
    // 4. Monaco Editor セットアップ & タグ自動閉じ
    // -------------------------------------------------------------
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });

    require(['vs/editor/editor.main'], function () {
      const activeProj = getActiveProject();
      document.getElementById('label-project-name').textContent = activeProj.name;

      window.htmlEditor = monaco.editor.create(document.getElementById('html-editor'), {
        value: activeProj.html,
        language: 'html',
        theme: currentTheme === 'dark' ? 'vs-dark' : 'vs',
        wordWrap: 'on',
        automaticLayout: true,
        minimap: { enabled: false },
        fontSize: 14,
        autoClosingBrackets: 'always',
        autoClosingQuotes: 'always',
        suggestOnTriggerCharacters: true
      });

      window.cssEditor = monaco.editor.create(document.getElementById('css-editor'), {
        value: activeProj.css,
        language: 'css',
        theme: currentTheme === 'dark' ? 'vs-dark' : 'vs',
        wordWrap: 'on',
        automaticLayout: true,
        minimap: { enabled: false },
        fontSize: 14,
        autoClosingBrackets: 'always',
        autoClosingQuotes: 'always',
        suggestOnTriggerCharacters: true
      });

      // 閉じタグ不要リスト
      const voidTags = new Set([
        'area', 'base', 'br', 'col', 'embed', 'hr', 'img',
        'input', 'link', 'meta', 'param', 'source', 'track', 'wbr'
      ]);

      // タグ自動閉じ機能（> を打ったら </tag> を生成）
      window.htmlEditor.onDidChangeModelContent((event) => {
        event.changes.forEach((change) => {
          if (change.text === '>') {
            const position = window.htmlEditor.getPosition();
            const model = window.htmlEditor.getModel();
            const lineContent = model.getLineContent(position.lineNumber);
            const textBeforeCursor = lineContent.substring(0, position.column - 1);

            if (textBeforeCursor.endsWith('/>')) return;

            const match = textBeforeCursor.match(/<([a-zA-Z0-9\-]+)(?:\s+[^>]*)?>$/);
            if (match) {
              const tagName = match[1].toLowerCase();
              if (!voidTags.has(tagName)) {
                const closeTag = `</${tagName}>`;
                window.htmlEditor.executeEdits('auto-close-tag', [{
                  range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column),
                  text: closeTag,
                  forceMoveMarkers: false
                }]);
                window.htmlEditor.setPosition(position);
              }
            }
          }
        });
      });

      const preview = document.getElementById('preview');

      // プレビュー反映 ＆ 自動保存
      function updateAll() {
        const html = window.htmlEditor.getValue();
        const css = window.cssEditor.getValue();

        // プロジェクトへ自動保存
        const cur = getActiveProject();
        cur.html = html;
        cur.css = css;
        saveProjects();

        // プレビュー更新
        preview.srcdoc = `
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <style>${css}</style>
          </head>
          <body>
            ${html}
          </body>
          </html>
        `;
      }

      window.htmlEditor.onDidChangeModelContent(updateAll);
      window.cssEditor.onDidChangeModelContent(updateAll);
      updateAll();

      // -------------------------------------------------------------
      // 5. ファイル読み込み（HTML / CSS / ZIP 対応）
      // -------------------------------------------------------------
      const fileInput = document.getElementById('file-loader');
      document.getElementById('btn-load-trigger').addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const filename = file.name.toLowerCase();

        if (filename.endsWith('.zip')) {
          // ZIP の解凍読み込み
          try {
            const zip = await JSZip.loadAsync(file);
            let loadedHtml = null;
            let loadedCss = null;

            for (const [relativePath, zipEntry] of Object.entries(zip.files)) {
              if (zipEntry.dir) continue;
              if (relativePath.endsWith('.html') || relativePath.endsWith('.htm')) {
                if (!loadedHtml) loadedHtml = await zipEntry.async('string');
              } else if (relativePath.endsWith('.css')) {
                if (!loadedCss) loadedCss = await zipEntry.async('string');
              }
            }

            if (loadedHtml !== null) window.htmlEditor.setValue(loadedHtml);
            if (loadedCss !== null) window.cssEditor.setValue(loadedCss);
            alert('ZIPからHTML/CSSを読み込みました！');
          } catch (err) {
            alert('ZIPの読み込みに失敗しました。');
          }
        } else if (filename.endsWith('.html') || filename.endsWith('.htm')) {
          const text = await file.text();
          window.htmlEditor.setValue(text);
        } else if (filename.endsWith('.css')) {
          const text = await file.text();
          window.cssEditor.setValue(text);
        } else {
          // テキストファイル等
          const text = await file.text();
          window.htmlEditor.setValue(text);
        }
        fileInput.value = '';
      });

      // -------------------------------------------------------------
      // 6. プロジェクトメニュー（≡）の操作
      // -------------------------------------------------------------
      const drawer = document.getElementById('drawer');
      const drawerOverlay = document.getElementById('drawer-overlay');
      const projectListEl = document.getElementById('project-list');

      function renderProjectList() {
        projectListEl.innerHTML = '';
        projects.forEach(p => {
          const item = document.createElement('div');
          item.className = 'project-item' + (p.id === activeProjectId ? ' active' : '');

          const titleSpan = document.createElement('span');
          titleSpan.textContent = p.name;
          titleSpan.style.flex = '1';
          titleSpan.style.cursor = 'pointer';
          titleSpan.onclick = () => switchProject(p.id);
          item.appendChild(titleSpan);

          const actions = document.createElement('div');
          actions.className = 'project-item-actions';

          // 名前変更ボタン
          const editBtn = document.createElement('button');
          editBtn.className = 'btn-small';
          editBtn.textContent = '改名';
          editBtn.onclick = (e) => {
            e.stopPropagation();
            const newName = prompt('プロジェクト名を入力:', p.name);
            if (newName && newName.trim()) {
              p.name = newName.trim();
              saveProjects();
              renderProjectList();
              if (p.id === activeProjectId) {
                document.getElementById('label-project-name').textContent = p.name;
              }
            }
          };
          actions.appendChild(editBtn);

          // 削除ボタン (プロジェクトが2つ以上あるときのみ)
          if (projects.length > 1) {
            const delBtn = document.createElement('button');
            delBtn.className = 'btn-small';
            delBtn.textContent = '削除';
            delBtn.onclick = (e) => {
              e.stopPropagation();
              if (confirm(`「${p.name}」を削除しますか？`)) {
                projects = projects.filter(item => item.id !== p.id);
                if (activeProjectId === p.id) {
                  activeProjectId = projects[0].id;
                }
                saveProjects();
                switchProject(activeProjectId);
              }
            };
            actions.appendChild(delBtn);
          }

          item.appendChild(actions);
          projectListEl.appendChild(item);
        });
      }

      function switchProject(id) {
        activeProjectId = id;
        saveProjects();
        const p = getActiveProject();
        document.getElementById('label-project-name').textContent = p.name;
        window.htmlEditor.setValue(p.html);
        window.cssEditor.setValue(p.css);
        closeDrawer();
      }

      function openDrawer() {
        renderProjectList();
        drawer.classList.add('open');
        drawerOverlay.style.display = 'block';
      }

      function closeDrawer() {
        drawer.classList.remove('open');
        drawerOverlay.style.display = 'none';
      }

      document.getElementById('btn-menu').addEventListener('click', openDrawer);
      document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
      drawerOverlay.addEventListener('click', closeDrawer);

      // 新規プロジェクト作成
      document.getElementById('btn-new-project').addEventListener('click', () => {
        const name = prompt('新しいプロジェクト名:', `プロジェクト ${projects.length + 1}`);
        if (name && name.trim()) {
          const newProj = {
            id: 'p_' + Date.now(),
            name: name.trim(),
            html: '',
            css: ''
          };
          projects.push(newProj);
          switchProject(newProj.id);
        }
      });
    });

    // -------------------------------------------------------------
    // 7. スマホ用タブ切り替え
    // -------------------------------------------------------------
    const tabButtons = document.querySelectorAll('.mobile-tab-btn');
    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.body.classList.remove('show-html', 'show-css', 'show-preview');
        document.body.classList.add(btn.dataset.tab);

        if (window.htmlEditor) window.htmlEditor.layout();
        if (window.cssEditor) window.cssEditor.layout();
      });
    });

    // -------------------------------------------------------------
    // 8. ZIP保存処理
    // -------------------------------------------------------------
    document.getElementById('download-zip').addEventListener('click', () => {
      if (!window.htmlEditor || !window.cssEditor) return;
      const zip = new JSZip();
      const html = window.htmlEditor.getValue();
      const css = window.cssEditor.getValue();

      let finalHtml = html;
      if (!html.toLowerCase().includes('<html')) {
        finalHtml = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
${html}
</body>
</html>`;
      } else if (!finalHtml.includes('style.css')) {
        if (finalHtml.includes('</head>')) {
          finalHtml = finalHtml.replace('</head>', '  <link rel="stylesheet" href="style.css">\n</head>');
        } else {
          finalHtml = finalHtml.replace(/<body[^>]*>/i, '<head>\n  <link rel="stylesheet" href="style.css">\n</head>\n$&');
        }
      }

      zip.file("index.html", finalHtml);
      zip.file("style.css", css);

      const projName = document.getElementById('label-project-name').textContent.trim() || 'web-project';
      zip.generateAsync({ type: "blob" }).then(function (blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${projName}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    });
  </script>
</body>
</html>
