<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Nambu Mobile Editor</title>

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFD400">

  <link rel="icon" id="dynamic-favicon">
  <link rel="apple-touch-icon" id="dynamic-apple-icon">
  <link rel="manifest" id="dynamic-manifest">

  <!-- Prism.js コア & CSS文法 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    /* 影・シャドウの完全排除 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      box-shadow: none !important;
      text-shadow: none !important;
      filter: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --nambu-yellow: #FFD400;
      --border-solid: 2px solid #000000;
      --font-code: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --error-red: #ff3b30;
    }

    /* ダークテーマ */
    html[data-theme="dark"] {
      --bg-base: #121212;
      --bg-editor: #1e1e1e;
      --bg-bar: #252526;
      --text-main: #d4d4d4;
      --border-color: #383838;
      --chip-bg: #2d2d2d;
      --caret-color: #FFD400;

      /* 予測変換ポップアップ */
      --popup-bg: #252526;
      --popup-border: #454545;
      --popup-item-hover: #04395e;

      /* VS Code Dark+ 配色 */
      --hl-doctype: #569cd6;
      --hl-doctype-name: #9cdcfe;
      --hl-tag: #569cd6;
      --hl-tag-bracket: #808080;
      --hl-attr-name: #9cdcfe;
      --hl-attr-val: #ce9178;
      --hl-comment: #6a9955;
      --hl-selector: #d7ba7d;
      --hl-property: #9cdcfe;
      --hl-val: #b5cea8;
      --hl-punc: #d4d4d4;
      --hl-keyword: #c586c0;
    }

    /* ライトテーマ */
    html[data-theme="light"] {
      --bg-base: #ffffff;
      --bg-editor: #f8f8f8;
      --bg-bar: #eeeeee;
      --text-main: #000000;
      --border-color: #d0d0d0;
      --chip-bg: #e2e2e2;
      --caret-color: #000000;

      /* 予測変換ポップアップ */
      --popup-bg: #f3f3f3;
      --popup-border: #cccccc;
      --popup-item-hover: #e8e8e8;

      /* VS Code Light+ 配色 */
      --hl-doctype: #0000ff;
      --hl-doctype-name: #001080;
      --hl-tag: #800000;
      --hl-tag-bracket: #808080;
      --hl-attr-name: #e50000;
      --hl-attr-val: #a31515;
      --hl-comment: #008000;
      --hl-selector: #800000;
      --hl-property: #ff0000;
      --hl-val: #098658;
      --hl-punc: #000000;
      --hl-keyword: #af00db;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-base);
      color: var(--text-main);
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ヘッダー */
    header {
      height: 48px;
      background-color: var(--nambu-yellow);
      color: #000000;
      border-bottom: var(--border-solid);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .header-group {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 100%;
    }

    .project-name {
      font-weight: 900;
      font-size: 14px;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-header {
      min-width: 38px;
      height: 36px;
      padding: 0 7px;
      background-color: #000000;
      color: var(--nambu-yellow);
      border: 1px solid #000000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-header svg {
      width: 17px;
      height: 17px;
      stroke: var(--nambu-yellow);
      fill: none;
      stroke-width: 2.3;
    }

    .btn-header:active {
      background-color: #ffffff;
      color: #000000;
    }
    .btn-header:active svg { stroke: #000000; }

    /* ワークスペース */
    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    .editor-pane {
      width: 50%;
      display: flex;
      flex-direction: column;
      border-right: var(--border-solid);
      background-color: var(--bg-editor);
    }

    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .editor-section:first-child {
      border-bottom: var(--border-solid);
    }

    .editor-label {
      padding: 4px 10px;
      background-color: var(--bg-bar);
      font-size: 11px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
    }

    /* エディタとハイライトの重ね合わせ */
    .editor-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .highlight-layer, textarea.code-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 12px;
      font-family: var(--font-code);
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      border: none;
      box-sizing: border-box;
      tab-size: 2;
    }

    .highlight-layer {
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      background: transparent;
      color: var(--text-main);
    }

    .highlight-layer code {
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      white-space: inherit;
    }

    textarea.code-input {
      z-index: 2;
      background: transparent;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: var(--caret-color);
      outline: none;
      resize: none;
      overflow: auto;
      -webkit-user-select: text;
      user-select: text;
    }

    textarea.code-input::selection {
      background: rgba(255, 212, 0, 0.45) !important;
      color: transparent !important;
      -webkit-text-fill-color: transparent !important;
    }

    /* シンタックスハイライト */
    .token.doctype, .token.doctype .token.doctype-tag { color: var(--hl-doctype) !important; font-weight: bold; }
    .token.doctype .token.name { color: var(--hl-doctype-name) !important; font-weight: normal; }

    .token.tag { color: var(--hl-tag) !important; }
    .token.tag .token.tag { color: var(--hl-tag) !important; font-weight: bold; }
    .token.tag .token.punctuation { color: var(--hl-tag-bracket) !important; }
    .token.attr-name { color: var(--hl-attr-name) !important; }
    .token.attr-value, .token.attr-value .token.punctuation:not(:first-child):not(:last-child) { color: var(--hl-attr-val) !important; }
    .token.string { color: var(--hl-attr-val) !important; }

    .token.selector { color: var(--hl-selector) !important; font-weight: bold; }
    .token.property { color: var(--hl-property) !important; }
    .token.number, .token.unit, .token.color { color: var(--hl-val) !important; }
    .token.punctuation { color: var(--hl-punc) !important; }
    .token.rule, .token.keyword { color: var(--hl-keyword) !important; }
    .token.comment { color: var(--hl-comment) !important; font-style: italic; }

    /* エラー波線 */
    .syntax-error {
      text-decoration: underline wavy var(--error-red) !important;
      -webkit-text-decoration: underline wavy var(--error-red) !important;
      text-decoration-skip-ink: none;
      text-underline-offset: 3px;
    }

    /* ★★★ カーソル直下 予測変換ポップアップ (IntelliSense) ★★★ */
    .autocomplete-popup {
      position: fixed;
      display: none;
      z-index: 999;
      background-color: var(--popup-bg);
      border: 1px solid #000000;
      outline: 2px solid var(--nambu-yellow);
      max-height: 200px;
      width: 260px;
      overflow-y: auto;
      font-family: var(--font-code);
      font-size: 13px;
    }

    .autocomplete-item {
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item.selected {
      background-color: var(--nambu-yellow) !important;
      color: #000000 !important;
      font-weight: 900;
    }

    .autocomplete-item .item-type {
      font-size: 10px;
      padding: 1px 4px;
      background: #000000;
      color: var(--nambu-yellow);
      font-weight: bold;
    }

    .autocomplete-item.selected .item-type {
      background: #000000;
      color: #ffffff;
    }

    .preview-pane {
      width: 50%;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }

    /* 記号バー */
    .symbol-bar {
      height: 42px;
      background-color: #000000;
      border-top: 2px solid var(--nambu-yellow);
      display: flex;
      align-items: center;
      overflow-x: auto;
      white-space: nowrap;
      padding: 0 6px;
      gap: 5px;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }
    .symbol-bar::-webkit-scrollbar { display: none; }

    .sym-btn {
      min-width: 36px;
      height: 34px;
      padding: 0 8px;
      background-color: #1a1a1a;
      color: var(--nambu-yellow);
      border: 1px solid #333333;
      font-size: 14px;
      font-family: var(--font-code);
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .sym-btn.nav-btn {
      background-color: var(--nambu-yellow);
      color: #000000;
      border-color: var(--nambu-yellow);
      font-weight: 900;
    }
    .sym-btn:active {
      background-color: #ffffff;
      color: #000000;
    }

    /* ボトムナビ */
    .bottom-nav {
      height: 48px;
      background-color: #000000;
      display: flex;
      border-top: 1px solid #333333;
      flex-shrink: 0;
    }

    .bottom-nav-btn {
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      color: #888888;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-top: 3px solid transparent;
    }

    .bottom-nav-btn.active {
      color: #000000;
      background-color: var(--nambu-yellow);
      border-top: 3px solid #000000;
    }

    /* ドロワー */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100%;
      background-color: var(--bg-base);
      border-right: var(--border-solid);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transition: left 0.18s ease-out;
    }
    .drawer.open { left: 0; }

    .drawer-header {
      height: 48px;
      padding: 0 12px;
      background-color: var(--nambu-yellow);
      color: #000000;
      font-weight: 900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: var(--border-solid);
    }

    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .project-card {
      padding: 12px 10px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-bar);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .project-card.active {
      border: var(--border-solid);
      background-color: var(--nambu-yellow);
      color: #000000;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .editor-pane, .preview-pane {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        display: none;
      }
      .editor-section { display: none; }

      .view-html #sec-html { display: flex; height: 100%; }
      .view-html .editor-pane { display: flex; }

      .view-css #sec-css { display: flex; height: 100%; }
      .view-css .editor-pane { display: flex; }

      .view-preview .preview-pane { display: flex; }

      .view-preview + .symbol-bar {
        display: none;
      }
    }

    @media (min-width: 769px) {
      .bottom-nav { display: none; }
    }
  </style>
</head>
<body class="view-html">

  <header>
    <div class="header-group">
      <button id="btn-menu" class="btn-header" title="メニュー">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <span id="label-project-name" class="project-name">新規</span>
    </div>

    <div class="header-group">
      <button id="btn-undo" class="btn-header" title="元に戻す">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
      </button>
      <button id="btn-redo" class="btn-header" title="やり直す">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      </button>
      <button id="btn-theme" class="btn-header" title="テーマ">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
      </button>
      <button id="btn-load-trigger" class="btn-header" title="読込">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <input type="file" id="file-loader" accept=".html,.css,.zip,.txt" style="display:none">
      <button id="btn-download-zip" class="btn-header" title="ZIP">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <div class="editor-pane">
      <div id="sec-html" class="editor-section">
        <div class="editor-label">HTML</div>
        <div class="editor-wrapper">
          <pre class="highlight-layer" aria-hidden="true"><code id="html-highlight"></code></pre>
          <textarea id="html-code" class="code-input" placeholder="HTMLを入力..." autocorrect="off" autocapitalize="none" spellcheck="false"></textarea>
        </div>
      </div>
      <div id="sec-css" class="editor-section">
        <div class="editor-label">CSS</div>
        <div class="editor-wrapper">
          <pre class="highlight-layer" aria-hidden="true"><code id="css-highlight"></code></pre>
          <textarea id="css-code" class="code-input" placeholder="CSSを入力..." autocorrect="off" autocapitalize="none" spellcheck="false"></textarea>
        </div>
      </div>
    </div>

    <div class="preview-pane">
      <iframe id="preview"></iframe>
    </div>
  </div>

  <!-- ★ 予測変換ポップアップ（カーソル追従） -->
  <div id="autocomplete-popup" class="autocomplete-popup"></div>

  <!-- 記号バー -->
  <div class="symbol-bar">
    <button class="sym-btn nav-btn" data-action="move-left">◀</button>
    <button class="sym-btn nav-btn" data-action="move-right">▶</button>
    <button class="sym-btn" data-action="template-html" style="font-size:12px; width:auto; padding:0 6px;">!HTML</button>
    <button class="sym-btn" data-insert="  ">Tab</button>
    <button class="sym-btn" data-insert='"' style="font-size:16px;">&quot;</button>
    <button class="sym-btn" data-insert="'">&#39;</button>
    <button class="sym-btn" data-insert="<">&lt;</button>
    <button class="sym-btn" data-insert=">">&gt;</button>
    <button class="sym-btn" data-insert="/">&sol;</button>
    <button class="sym-btn" data-insert="=">=</button>
    <button class="sym-btn" data-insert="{">&#123;</button>
    <button class="sym-btn" data-insert="}">&#125;</button>
    <button class="sym-btn" data-insert="(">(</button>
    <button class="sym-btn" data-insert=")">)</button>
    <button class="sym-btn" data-insert=":">:</button>
    <button class="sym-btn" data-insert=";">;</button>
    <button class="sym-btn" data-insert=".">.</button>
    <button class="sym-btn" data-insert="#">#</button>
    <button class="sym-btn" data-insert="!">!</button>
  </div>

  <div class="bottom-nav">
    <button class="bottom-nav-btn active" data-tab="view-html">HTML</button>
    <button class="bottom-nav-btn" data-tab="view-css">CSS</button>
    <button class="bottom-nav-btn" data-tab="view-preview">PREVIEW</button>
  </div>

  <!-- ドロワー -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <div id="drawer" class="drawer">
    <div class="drawer-header">
      <span>PROJECTS</span>
      <button id="btn-close-drawer" class="btn-header" style="min-width:32px; height:32px;">✕</button>
    </div>
    <div style="padding: 8px; border-bottom: 1px solid var(--border-color);">
      <button id="btn-new-project" class="btn-header" style="width: 100%; height: 38px;">＋ 新規プロジェクト</button>
    </div>
    <div id="project-list" class="drawer-list"></div>
  </div>

  <script>
    // HTML標準タグリスト
    const validHtmlTags = new Set([
      'html', 'head', 'body', 'title', 'meta', 'link', 'style', 'script', 'noscript',
      'div', 'span', 'p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'br', 'hr',
      'a', 'button', 'input', 'textarea', 'select', 'option', 'optgroup', 'form', 'label', 'fieldset', 'legend',
      'ul', 'ol', 'li', 'dl', 'dt', 'dd',
      'table', 'thead', 'tbody', 'tfoot', 'tr', 'th', 'td', 'caption', 'col', 'colgroup',
      'img', 'audio', 'video', 'source', 'track', 'canvas', 'svg', 'iframe', 'embed', 'object', 'param', 'picture',
      'header', 'footer', 'main', 'nav', 'section', 'article', 'aside', 'figure', 'figcaption',
      'b', 'strong', 'i', 'em', 'u', 's', 'small', 'mark', 'sub', 'sup', 'code', 'pre', 'kbd', 'samp', 'var',
      'blockquote', 'q', 'cite', 'abbr', 'address', 'time', 'progress', 'meter', 'details', 'summary', 'dialog'
    ]);

    function isValidHtmlTag(tagName) {
      if (!tagName) return true;
      const lower = tagName.toLowerCase();
      if (lower.startsWith('!') || lower === '!doctype') return true;
      if (validHtmlTags.has(lower)) return true;
      const el = document.createElement(lower);
      return !(el instanceof HTMLUnknownElement);
    }

    function isValidCssProperty(propName) {
      if (!propName) return true;
      const p = propName.trim().toLowerCase();
      if (!p || p.startsWith('--')) return true;
      try {
        return CSS.supports(p, 'inherit') || CSS.supports(p, 'initial') || CSS.supports(`${p}: initial`);
      } catch (e) {
        return false;
      }
    }

    Prism.hooks.add('wrap', function (env) {
      if (env.type === 'property') {
        const rawProp = env.content.replace(/<[^>]*>/g, '').trim();
        if (rawProp && !isValidCssProperty(rawProp)) {
          env.classes.push('syntax-error');
        }
      }
      if (env.type === 'tag') {
        const text = typeof env.content === 'string' ? env.content : env.content.toString();
        const match = text.match(/<\/?([a-zA-Z0-9\-]+)/);
        if (match) {
          const tagName = match[1];
          if (!isValidHtmlTag(tagName)) {
            env.classes.push('syntax-error');
          }
        }
      }
    });

    // PWA アイコン自動生成
    (function setupPWA() {
      const canvas = document.createElement('canvas');
      canvas.width = 192;
      canvas.height = 192;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFD400';
      ctx.fillRect(0, 0, 192, 192);
      ctx.fillStyle = '#000000';
      ctx.font = '900 80px -apple-system, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('</>', 96, 96);

      const iconUrl = canvas.toDataURL('image/png');

    // Undo / Redo
    class HistoryManager {
      constructor(input, onUpdate) {
        this.input = input;
        this.onUpdate = onUpdate;
        this.undoStack = [];
        this.redoStack = [];
        this.lastVal = input.value;
        this.timer = null;
      }
      record(val) {
        if (val === this.lastVal) return;
        clearTimeout(this.timer);
        this.timer = setTimeout(() => {
          this.undoStack.push({ val: this.lastVal, pos: this.input.selectionStart });
          if (this.undoStack.length > 50) this.undoStack.shift();
          this.redoStack = [];
          this.lastVal = val;
        }, 300);
      }
      undo() {
        if (!this.undoStack.length) return;
        this.redoStack.push({ val: this.input.value, pos: this.input.selectionStart });
        const state = this.undoStack.pop();
        this.input.value = state.val;
        this.input.setSelectionRange(state.pos, state.pos);
        this.lastVal = state.val;
        this.onUpdate();
      }
      redo() {
        if (!this.redoStack.length) return;
        this.undoStack.push({ val: this.input.value, pos: this.input.selectionStart });
        const state = this.redoStack.pop();
        this.input.value = state.val;
        this.input.setSelectionRange(state.pos, state.pos);
        this.lastVal = state.val;
        this.onUpdate();
      }
    }

    const htmlHistory = new HistoryManager(htmlInput, () => onEditorChange(htmlInput, htmlHighlight, 'html'));

    // プレビュー生成
    function buildPreviewHtml(rawHtml, rawCss) {
      const trimmed = rawHtml.trim();
      const styleBlock = `<style id="_nambu_injected_style_">\n${rawCss}\n</style>`;

      if (/<!doctype\s|<html[\s>]/i.test(trimmed)) {
        let result = rawHtml;
        if (/<head[\s>]/i.test(result)) {
          return result.replace(/<head[\s>]/i, `$&\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  ${styleBlock}`);
        }
        if (/<html[\s>]/i.test(result)) {
          return result.replace(/<html[\s>]/i, `$&\n<head>\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  ${styleBlock}\n</head>`);
        }
        return `<meta name="viewport" content="width=device-width, initial-scale=1.0">\n${styleBlock}\n` + result;
      }

      return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  ${styleBlock}
</head>
<body>
${rawHtml}
</body>
</html>`;
    }

    let previewDebounce = null;

    function onEditorChange(input, highlightElem, lang) {
      // ★ 全角スペース自動置換ガード（全角スペースの事故を未然に防ぐ）

        input.setSelectionRange(pos, pos);
      }

      updateHighlight(input, highlightElem, lang);

      else cssHistory.record(input.value);

    cssInput.addEventListener('input', () => onEditorChange(cssInput, cssHighlight, 'css'));

    // クォーテーション & 括弧の自動ペア補完
    const pairs = { '"': '"', "'": "'", '{': '}', '(': ')', '[': ']' };
    const closingChars = new Set(['"', "'", '}', ')', ']']);

    function setupAutoPairs(input, highlightElem, lang) {
      input.addEventListener('keydown', (e) => {
        const pos = input.selectionStart;
        const end = input.selectionEnd;
        const val = input.value;
        const nextChar = val[pos];

        if (closingChars.has(e.key) && nextChar === e.key && pos === end) {
          e.preventDefault();
          input.setSelectionRange(pos + 1, pos + 1);
          return;
        }

        if (pairs[e.key]) {
          e.preventDefault();
          const open = e.key;
          const close = pairs[e.key];

          if (pos !== end) {
            const selected = val.substring(pos, end);
            input.setRangeText(open + selected + close, pos, end, 'end');
            input.setSelectionRange(pos + 1, end + 1);
          } else {
            input.setRangeText(open + close, pos, pos, 'end');
            input.setSelectionRange(pos + 1, pos + 1);
          }
          onEditorChange(input, highlightElem, lang);
          return;
        }

        if (e.key === 'Backspace' && pos === end && pos > 0) {
          const prev = val[pos - 1];
          const curr = val[pos];
          if (pairs[prev] && pairs[prev] === curr) {
            e.preventDefault();
            input.setRangeText('', pos - 1, pos + 1, 'end');
            input.setSelectionRange(pos - 1, pos - 1);
            onEditorChange(input, highlightElem, lang);
            return;
          }
        }
      });
    }

    htmlInput.addEventListener('input', (e) => {

    // スマートEnter
    function handleSmartEnter(textarea, highlightElem, lang) {
      textarea.addEventListener('keydown', (e) => {
        // ポップアップが開いていて選択中の場合はEnter/Tabをポップアップ確定に譲る
        if (popupVisible && (e.key === 'Enter' || e.key === 'Tab')) {
          return; // handlePopupKeyDownで処理
        }

        if (e.key === 'Enter') {
          const pos = textarea.selectionStart;
          const val = textarea.value;
          const before = val.substring(0, pos);
          const after = val.substring(pos);

          const lines = before.split('\n');
          const currentLine = lines[lines.length - 1];
          const indentMatch = currentLine.match(/^(\s*)/);
          const baseIndent = indentMatch ? indentMatch[1] : '';

          const isBetweenTags = before.endsWith('>') && after.startsWith('</');
          const isBetweenBraces = before.endsWith('{') && after.startsWith('}');

          if (isBetweenTags || isBetweenBraces) {
            e.preventDefault();
            const childIndent = baseIndent + '  ';
            const insertText = '\n' + childIndent + '\n' + baseIndent;
            textarea.setRangeText(insertText, pos, pos, 'end');
            const newCursorPos = pos + 1 + childIndent.length;
            textarea.setSelectionRange(newCursorPos, newCursorPos);
            onEditorChange(textarea, highlightElem, lang);
            return;
          }

          e.preventDefault();
          const insertText = '\n' + baseIndent;
          textarea.setRangeText(insertText, pos, pos, 'end');
          const newCursorPos = pos + insertText.length;
          textarea.setSelectionRange(newCursorPos, newCursorPos);
          onEditorChange(textarea, highlightElem, lang);
        }
      });
    }

    // キャレットの画面上XY座標を取得するヘルパー
    function getCaretXY(textarea) {
      let div = document.getElementById('_caret_measure_div_');
      if (!div) {
        div = document.createElement('div');
        div.id = '_caret_measure_div_';
        document.body.appendChild(div);
      }

      const style = window.getComputedStyle(textarea);
      div.style.position = 'absolute';
      div.style.visibility = 'hidden';
      div.style.whiteSpace = 'pre-wrap';
      div.style.wordBreak = 'break-all';
      div.style.fontFamily = style.fontFamily;
      div.style.fontSize = style.fontSize;
      div.style.lineHeight = style.lineHeight;
      div.style.padding = style.padding;
      div.style.border = style.border;
      div.style.boxSizing = style.boxSizing;
      div.style.width = textarea.clientWidth + 'px';
      div.style.top = '0';
      div.style.left = '0';

      const pos = textarea.selectionStart;
      div.textContent = textarea.value.substring(0, pos);
      const span = document.createElement('span');
      span.textContent = textarea.value.substring(pos) || '.';
      div.appendChild(span);

      const rect = textarea.getBoundingClientRect();
      return {
        top: rect.top + span.offsetTop - textarea.scrollTop + 22,
        left: rect.left + span.offsetLeft - textarea.scrollLeft
      };
    }

    function handleAutoComplete(input, lang) {
      targetInput = input;
      const pos = input.selectionStart;
      const val = input.value;
      const before = val.substring(0, pos);
      
      // 入力中の直前ワードを抽出
      const match = before.match(/([a-zA-Z0-9_\-:<]+)$/);
      if (!match) {
        closePopup();
        return;
      }

      currentWord = match[1].toLowerCase();
      if (currentWord.length < 1) {
        closePopup();
        return;
      }

      const list = lang === 'html' ? htmlSuggestions : cssSuggestions;
      currentFiltered = list.filter(item => {
        const target = item.label.toLowerCase();
        return target.includes(currentWord) || item.text.toLowerCase().includes(currentWord);
      }).slice(0, 7);

      if (currentFiltered.length === 0) {
        closePopup();
        return;
      }

      renderPopup(input);
    }

    function renderPopup(input) {
      selectedIndex = 0;
      popup.innerHTML = '';

      currentFiltered.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'autocomplete-item' + (index === 0 ? ' selected' : '');
        
        const labelSpan = document.createElement('span');
        labelSpan.textContent = item.label;
        
        const typeBadge = document.createElement('span');
        typeBadge.className = 'item-type';
        typeBadge.textContent = item.type;

        row.appendChild(labelSpan);
        row.appendChild(typeBadge);

        row.onmousedown = (e) => e.preventDefault();
        row.onclick = () => applySuggestion(item);

        popup.appendChild(row);
      });

      const coords = getCaretXY(input);
      // 画面端からはみ出さないよう調整
      let top = coords.top;
      let left = Math.min(coords.left, window.innerWidth - 270);
      if (top + 210 > window.innerHeight) {
        top = top - 230; // 下に余白がなければ上に表示
      }

      popup.style.top = Math.max(10, top) + 'px';
      popup.style.left = Math.max(10, left) + 'px';
      popup.style.display = 'block';
      popupVisible = true;
    }

    function closePopup() {
      popup.style.display = 'none';
      popupVisible = false;
    }

    function applySuggestion(item) {
      if (!targetInput) return;
      const pos = targetInput.selectionStart;
      const start = pos - currentWord.length;

      targetInput.setRangeText(item.text, start, pos, 'end');
      
      // カーソル位置をオフセット指定があればそこへ
      if (item.cursorOffset) {
        const newPos = start + item.cursorOffset;
        targetInput.setSelectionRange(newPos, newPos);
      }

      targetInput.focus();
      closePopup();
      
      const isCss = targetInput === cssInput;
      onEditorChange(targetInput, isCss ? cssHighlight : htmlHighlight, isCss ? 'css' : 'html');
    }

    // キーボード（↑ ↓ Enter Tab Esc）で予測変換を操作
    function handlePopupKeyDown(e) {
      if (!popupVisible) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % currentFiltered.length;
        updatePopupSelection();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + currentFiltered.length) % currentFiltered.length;
        updatePopupSelection();
      } else if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        applySuggestion(currentFiltered[selectedIndex]);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closePopup();
      }
    }

    function updatePopupSelection() {
      const items = popup.querySelectorAll('.autocomplete-item');
      items.forEach((item, idx) => {
        if (idx === selectedIndex) {
          item.classList.add('selected');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('selected');
        }
      });
    }

          input.setSelectionRange(next, next);
          input.focus();
        } else if (btn.dataset.action === 'move-right') {
          const next = Math.min(input.value.length, input.selectionStart + 1);

    // ZIPダウンロード
    document.getElementById('btn-download-zip').addEventListener('click', () => {
      const zip = new JSZip();
      const html = htmlInput.value;

      let finalHtml = html;
      if (!html.toLowerCase().includes('<html')) {
        finalHtml = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Document</title><link rel="stylesheet" href="style.css"></head><body>\n${html}\n</body></html>`;
      } else if (!finalHtml.includes('style.css')) {
        finalHtml = finalHtml.includes('</head>') ? finalHtml.replace('</head>', '  <link rel="stylesheet" href="style.css">\n</head>') : `<link rel="stylesheet" href="style.css">\n${finalHtml}`;
      }
      zip.file("index.html", finalHtml);
      zip.file("style.css", css);

      const name = document.getElementById('label-project-name').textContent.trim() || 'project';
      zip.generateAsync({ type: "blob" }).then(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${name}.zip`;
        a.click();
        URL.revokeObjectURL(a.href);
      });
    });

    // プロジェクト一覧
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('drawer-overlay');
    const listEl = document.getElementById('project-list');

    function renderList() {
      listEl.innerHTML = '';
      projects.forEach(p => {
        const card = document.createElement('div');
        card.className = 'project-card' + (p.id === activeProjectId ? ' active' : '');

        const title = document.createElement('span');
        title.textContent = p.name;
        title.style.flex = '1';
        title.onclick = () => switchProj(p.id);
        card.appendChild(title);

        const actions = document.createElement('div');
        actions.style.display = 'flex';
        actions.style.gap = '4px';

        const renameBtn = document.createElement('button');
        renameBtn.className = 'btn-header';
        renameBtn.style.cssText = 'min-width:32px; height:30px; font-size:11px;';
        renameBtn.textContent = '改名';
        renameBtn.onclick = (e) => {
          e.stopPropagation();
          const val = prompt('プロジェクト名:', p.name);
          if (val && val.trim()) {
            p.name = val.trim();
            saveProjects();
            renderList();
            if (p.id === activeProjectId) document.getElementById('label-project-name').textContent = p.name;
          }
        };
        actions.appendChild(renameBtn);

        if (projects.length > 1) {
          const delBtn = document.createElement('button');
          delBtn.className = 'btn-header';
          delBtn.style.cssText = 'min-width:32px; height:30px; font-size:11px; background:#cc0000; color:#fff; border-color:#cc0000;';
          delBtn.textContent = '削除';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            if (confirm(`「${p.name}」を削除しますか？`)) {
              projects = projects.filter(item => item.id !== p.id);
              if (activeProjectId === p.id) activeProjectId = projects[0].id;
              saveProjects();
              switchProj(activeProjectId);
            }
          };
          actions.appendChild(delBtn);
        }

        card.appendChild(actions);
        listEl.appendChild(card);
      });
    }

    function switchProj(id) {
      activeProjectId = id;
      saveProjects();
      const p = getActiveProject();
      document.getElementById('label-project-name').textContent = p.name;
      htmlInput.value = p.html;
      cssInput.value = p.css;
      updateHighlight(htmlInput, htmlHighlight, 'html');
      updateHighlight(cssInput, cssHighlight, 'css');
      schedulePreview();
      closeDrawer();
      closePopup();
    }

    function openDrawer() { renderList(); drawer.classList.add('open'); overlay.style.display = 'block'; }
    function closeDrawer() { drawer.classList.remove('open'); overlay.style.display = 'none'; }
    document.getElementById('btn-menu').addEventListener('click', openDrawer);
    document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    document.getElementById('btn-new-project').addEventListener('click', () => {
      const val = prompt('新規プロジェクト名:', `プロジェクト ${projects.length + 1}`);
      if (val && val.trim()) {
        const np = { id: 'p_' + Date.now(), name: val.trim(), html: '', css: '' };
        projects.push(np);
        switchProj(np.id);
      }
    });
  </script>
</body>
</html>
